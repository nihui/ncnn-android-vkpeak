name: release-apk
on: workflow_dispatch

env:
  MESA_TURNIP_VERSION: 26.2.5
  MOMOTEN_VERSION: 20261020
  BUILD_TOOLS_VERSION: 36.0.0

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: ndk-fix-debug
      run: |
        sdkmanager "ndk;30.0.16248370"
        sed -i -e '/^  -g$/d' "${ANDROID_HOME}/ndk/30.0.16248370/build/cmake/android-legacy.toolchain.cmake"

    - name: vulkan-turnip-driver
      run: |
        wget -q https://github.com/nihui/mesa-turnip-android-driver/releases/download/${MESA_TURNIP_VERSION}/mesa-turnip-android-${MESA_TURNIP_VERSION}.zip
        mkdir -p app/src/main/jniLibs/arm64-v8a
        unzip -q mesa-turnip-android-${MESA_TURNIP_VERSION}.zip -d app/src/main/jniLibs/arm64-v8a

    - name: vulkan-momoten-driver
      run: |
        set -euo pipefail
        mkdir -p app/src/main/assets/licenses/momoten
        while read -r abi api sha256; do
          archive="momoten-${MOMOTEN_VERSION}-android-${abi}-api${api}.zip"
          curl -fL --retry 3 -o "$archive" "https://github.com/nihui/momoten/releases/download/${MOMOTEN_VERSION}/${archive}"
          echo "$sha256  $archive" | sha256sum -c -
          mkdir -p "app/src/main/jniLibs/${abi}"
          unzip -p "$archive" lib/libmomoten.so > "app/src/main/jniLibs/${abi}/libmomoten.so"
          test -s "app/src/main/jniLibs/${abi}/libmomoten.so"
          for notice in LICENSE.txt THIRD_PARTY_NOTICES.md; do
            unzip -p "$archive" "$notice" > "$notice"
            test -s "$notice"
            if [ -f "app/src/main/assets/licenses/momoten/$notice" ]; then
              cmp "$notice" "app/src/main/assets/licenses/momoten/$notice"
            else
              cp "$notice" "app/src/main/assets/licenses/momoten/$notice"
            fi
          done
        done <<'EOF'
        arm64-v8a 21 b061c51a66e9658dfa2223b9203d190004f3ca6fbbfcbda6aea3f158106b4508
        armeabi-v7a 14 fbc79b40e402d8a6d8a826c59e233f5d5308cb2977691c5217b15f33ccc7399f
        x86 14 e69c1b3b7d25a56f854872906979208c38acc2d6549a9b9d318385d99280869f
        x86_64 21 b954eb04cd8131bd8014054b3e5f26dbc300badce6b227e537187e5147fae696
        EOF

    - name: build-apk
      run: |
        bash ./gradlew assembleRelease --stacktrace

    - name: sign-apk
      id: signapk
      run: |
        DATE=`date +'%Y%m%d'`
        SHA_SHORT=`git rev-parse --short HEAD`
        UNSIGNED_APK=`find app/build/outputs/apk/release -type f -name "*-release-unsigned.apk" | head -n 1`
        ALIGNED_APK=${UNSIGNED_APK//-release-unsigned.apk/-release-unsigned-aligned.apk}
        SIGNED_APK=${{ github.event.repository.name }}-${DATE}.${SHA_SHORT}.apk
        keytool -genkey -noprompt -alias ncnn \
            -dname "CN=mqttserver.ibm.com, OU=ID, O=IBM, L=Hursley, S=Hants, C=GB"\
            -keystore ncnn.keystore -storepass 7767517 -keypass 7767517 \
            -keyalg RSA -keysize 2048 -validity 10000
        ${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/zipalign -f -v 4 ${UNSIGNED_APK} ${SIGNED_APK}
        ${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner sign --ks ncnn.keystore --ks-key-alias ncnn \
            --ks-pass pass:7767517 --key-pass pass:7767517 --out ${SIGNED_APK} ${SIGNED_APK}
        ${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}/apksigner verify ${SIGNED_APK}
        echo "SIGNED_APK=${SIGNED_APK}" >> $GITHUB_OUTPUT
        echo "APK_VERSION=${DATE}.${SHA_SHORT}" >> $GITHUB_OUTPUT

    - name: create-release
      uses: softprops/action-gh-release@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: ${{ steps.signapk.outputs.APK_VERSION }}
        name: Release ${{ steps.signapk.outputs.APK_VERSION }}
        files: ${{ steps.signapk.outputs.SIGNED_APK }}
